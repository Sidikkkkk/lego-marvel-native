name: Build Universal LEGO Native Loader APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Configure Pre-installed NDK & CMake
        run: |
          NDK_VER=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -n 1)
          CMAKE_VER=$(ls "$ANDROID_HOME/cmake" | sort -V | tail -n 1)
          echo "Menggunakan NDK bawaan: $NDK_VER | CMake: $CMAKE_VER"
          sed -i "s/compileSdk = 34/compileSdk = 34\n    ndkVersion = \"$NDK_VER\"/" app/build.gradle.kts
          sed -i "s/3.22.1/$CMAKE_VER/" app/build.gradle.kts
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lego-marvel-universal-arm64
          path: app/build/outputs/apk/debug/app-debug.apk
